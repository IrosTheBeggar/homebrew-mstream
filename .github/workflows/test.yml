# Proves the formula everywhere brew serves it: Apple Silicon on a real
# Mac runner, Homebrew-on-Linux beside it — and the Intel build executed
# under Rosetta 2 on the same Mac, because GitHub's Intel runner pool is
# retired in all but name and a job that queues for ten hours proves
# nothing.
name: brew

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      # Installs brew where the runner image lacks it (today's ubuntu) and
      # checks this repository out as the tap it names — brew refuses
      # formulas outside a tap.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: ALSA for the test block (Linux)
        if: runner.os == 'Linux'
        # noble renamed the package in the time_t transition; take either.
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Style
        run: brew style irosthebeggar/mstream

      - name: Install
        run: brew install irosthebeggar/mstream/mstream-player

      - name: Runs on this hardware
        run: mstream-player --version

      - name: Test block
        run: brew test irosthebeggar/mstream/mstream-player

      - name: Intel build runs under Rosetta
        if: runner.os == 'macOS'
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license || true
          version=$(mstream-player --version | awk '{print $2}')
          base="https://github.com/IrosTheBeggar/mstream-terminal-player/releases/download/v${version}"
          curl -fsSL -o /tmp/mp-x64 "${base}/mstream-player-darwin-x64"
          curl -fsSL -o /tmp/manifest.json "${base}/manifest.json"
          expected=$(sed -n 's/.*"file": "mstream-player-darwin-x64", "sha256": "\([0-9a-f]*\)".*/\1/p' /tmp/manifest.json)
          actual=$(shasum -a 256 /tmp/mp-x64 | cut -d' ' -f1)
          [ "${expected}" = "${actual}" ] || { echo "hash mismatch" >&2; exit 1; }
          chmod +x /tmp/mp-x64
          arch -x86_64 /tmp/mp-x64 --version
